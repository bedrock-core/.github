name: Apply the prepared Minecraft update
description: Apply the same candidate changes in compatibility checks and the pull request
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: minecraft-update
        path: ${{ runner.temp }}
    - name: Apply the candidate changes
      shell: bash
      run: |
        if [[ -s "$RUNNER_TEMP/minecraft-update.patch" ]]; then
          git apply "$RUNNER_TEMP/minecraft-update.patch"
        fi
